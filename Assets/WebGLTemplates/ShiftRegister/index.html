<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Fill the screen on phones: no zooming, content under notches handled by the game's margins. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#C3CD9C">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #C3CD9C;
        /* No pull-to-refresh, page scrolling, text selection or tap flashes over the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        background: #C3CD9C;
        touch-action: none;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #232C15;
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      #loading-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 6px;
      }
      #loading-bar {
        width: min(320px, 70vw);
        height: 22px;
        box-sizing: border-box;
        border: 3px solid #232C15;
        border-radius: 6px;
        padding: 3px;
      }
      #loading-fill {
        width: 0%;
        height: 100%;
        background: #232C15;
        border-radius: 2px;
      }
      #loading-text {
        font-size: 13px;
        color: #46522D;
        letter-spacing: 2px;
      }
      #banner {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        max-width: 90vw;
        font: 13px ui-monospace, Menlo, Consolas, monospace;
        color: #DCE4BC;
        display: none;
      }
      #banner div {
        background: #232C15;
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 6px;
      }
      #banner div.error {
        background: #A2402A;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-title">SHIFT REGISTER</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">LOADING 0%</div>
    </div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Warnings fade after a few seconds; errors stay on top of the game.
      function showBanner(msg, type) {
        var banner = document.querySelector("#banner");
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type == "error") div.className = "error";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            if (!banner.children.length) banner.style.display = "none";
          }, 5000);
        }
      }

      // Touch screens: keep long presses and stray scrolling from reaching the browser.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      var buildUrl = "Build";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Saved progress and options persist without manual syncing.
        autoSyncPersistentDataPath: true,
        // Sharp on high-density phone screens, but at most 2x to keep the frame rate up.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        var loading = document.querySelector("#loading");
        var fill = document.querySelector("#loading-fill");
        var text = document.querySelector("#loading-text");
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = 100 * progress + "%";
          text.textContent = "LOADING " + Math.round(100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
